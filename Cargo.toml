[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]
# patched/: normalised upstream sources consumed via [patch.crates-io] (each is
# its own package/workspace).
exclude = ["patched"]

[workspace.package]
version = "1.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/BatoRoy/bato-native"

# Inside this repo the patched crates come from the tree. Apps get the same
# sources from git (see README "Using bato-native in an app"); [patch] is
# honoured only in the root manifest, so every app repeats this block.
[patch.crates-io]
winit = { path = "patched/winit" }
cosmic-text = { path = "patched/cosmic-text" }
cryoglyph = { path = "patched/cryoglyph" }
iced_wgpu = { path = "patched/iced_wgpu" }
iced_winit = { path = "patched/iced_winit" }
smithay-clipboard = { path = "patched/smithay-clipboard" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
# panic = "unwind" (the default) on purpose: the frame's error boundary then
# shows React's "Something went wrong · Reload" fallback and keeps the app
# state instead of the window disappearing (user decision, Phase 3).

# Keep the cache small (CI) and debug builds fast.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

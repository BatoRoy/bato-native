[package]
name = "gallery"
description = "The Showcase: every bato-kit component, the kit's visual test bench."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bato-kit = { path = "../../crates/bato-kit" }
bato-shell = { path = "../../crates/bato-shell" }

# platform_tmp.rs only (replaced by bato-shell once Phase 1.3 merges): smoke
# timing, the backend health call, the desktop notification.
libc = "0.2"
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

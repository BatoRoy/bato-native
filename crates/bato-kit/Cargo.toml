[package]
name = "bato-kit"
description = "The Hybrid widget kit for native Bato apps (iced). Re-exports iced."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The code editor (`editor`): cosmic-text's own editor stack (`vi` brings
# `SyntaxEditor` + `ViEditor`, syntect and modit) plus two-face's extra
# syntaxes (TypeScript, TSX). Off by default: it adds a few MB to a binary.
editor = ["cosmic-text/vi", "dep:syntect", "dep:two-face", "dep:modit", "dep:cosmic_undo_2"]

[dependencies]
bato-theme = { path = "../bato-theme" }
scroll-physics = { path = "../scroll-physics" }

# Apps use iced only through `bato_kit::iced`, so the kit picks the features:
# wgpu (Vulkan; the backdrop blur needs it) with tiny-skia as the software
# fallback, Wayland and X11, SVG icons, raster images (decoded by the kit
# off the UI thread, so iced's own codecs stay off), and the advanced widget API.
iced = { version = "=0.14.0", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "web-colors",
    "wayland",
    "x11",
    "thread-pool",
    "svg",
    "image-without-codecs",
    "advanced",
] }
# Raster decoding for `thumb` (thumbnails, previews, avatars), on worker
# threads: the formats Chromium shows in an <img> that apps meet in
# practice. No AVIF/HEIC/TIFF (Chromium has no TIFF either) and no rayon.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico"] }
# The backdrop blur is a wgpu shader primitive.
wgpu = { version = "27", default-features = false, features = ["wgsl"] }

# The five patched upstream crates (bato-native/patched, applied by every
# app's [patch.crates-io]). Direct dependencies at the exact patched versions
# so `lib.rs` can reference their BATO_PATCH tripwires: if a build ever
# resolves the crates.io release instead, it fails to compile.
winit = { version = "=0.30.13", default-features = false }
cosmic-text = { version = "=0.15.0", default-features = false }
cryoglyph = { version = "=0.1.0", default-features = false }
iced_wgpu = { version = "=0.14.0", default-features = false }
iced_winit = { version = "=0.14.1", default-features = false }
smithay-clipboard = { version = "=0.7.3", default-features = false }
# FreeType for the patched cosmic-text rasterizer, built from source
# (`bundled`): the same hinting on every machine and no system FreeType
# requirement. See README "FreeType".
freetype-sys = { version = "0.23", features = ["bundled"] }

# `editor` only. syntect for its types (cosmic-text's own dependency brings
# the default features: Oniguruma regexes, the default syntax dump).
syntect = { version = "5", optional = true, default-features = false }
two-face = { version = "0.5", optional = true, default-features = false, features = ["syntect-onig"] }
# `editor` only: the vim parser and undo stack of the kit's vendored
# `ViEditor` (editor/vi.rs), the versions cosmic-text's `vi` feature uses.
modit = { version = "=0.1.5", optional = true }
cosmic_undo_2 = { version = "=0.2.0", optional = true }

# `data::qr`: QR code encoding (no dependencies).
qrcodegen = "1.8"
# Byte ranges → iced text_input cursor positions (its graphemes).
unicode-segmentation = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
